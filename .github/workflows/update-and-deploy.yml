name: Market Intelligence Pipeline & Pages Deploy

on:
  schedule:
    # Run twice daily: 02:00 UTC (07:30 AM SLT) and 14:00 UTC (07:30 PM SLT)
    - cron: '0 2,14 * * *'
  workflow_dispatch:
    inputs:
      run_scrapers:
        description: 'Run live store scrapers'
        required: true
        type: boolean
        default: true
      max_pages:
        description: 'Max pages per store category'
        required: false
        type: string
        default: '5'
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.gitattributes'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and data commits
permissions:
  contents: write
  pages: write
  id-token: write

# Prevent concurrent deployments from colliding by queuing them until previous finishes
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_scrapers == 'true')
        run: |
          playwright install chromium --with-deps

      - name: Execute store scrapers
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_scrapers == 'true')
        run: |
          PAGES="${{ github.event.inputs.max_pages || '5' }}"
          echo "Starting store scrapers with max_pages=$PAGES..."
          python orchestrator.py --all --max-pages "$PAGES" || echo "Scrapers finished with non-fatal warnings."

      - name: Rebuild master dataset & static JSONs
        run: |
          python merger.py

      - name: Commit & push updated market intelligence data
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git status --porcelain data/ | grep -q .; then
            echo "Changes detected in data/. Committing..."
            git commit -m "chore(catalog): auto-update hardware market prices [skip ci]"
            echo "Pushing changes with rebase synchronization..."
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin main && echo "Successfully pushed data updates!" && break || (echo "Push race detected, retrying in 5s ($i/3)..." && sleep 5)
            done || echo "Warning: Non-critical push retry limit reached. Continuing to Pages deployment."
          else
            echo "No data changes detected. Skipping git push."
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build-and-update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
